name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit test
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ["ubuntu-latest", "macos-latest"]
        python-version: [ "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Tests (with coverage)
        # run: |
        #   uv run coverage run -m pytest tests/unittests
        #   uv run coverage report -m --ignore-errors
        env:
          PYTHONPATH: src
        run: |
                  uv run coverage run -m pytest \
                    tests/test_data.py \
                    tests/test_model.py \
                    tests/test_training.py \
                    tests/test_evaluate.py
                  uv run coverage report -m --ignore-errors

  integration-test:
      needs: unit-test
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install uv
          uses: astral-sh/setup-uv@v3
          with:
            enable-cache: true

        - name: Install dependencies
          run: uv sync --dev --locked

        - name: Run API Integration Tests
          run: uv run pytest tests/integrationtests

        - name: Run Load Test (Headless)
          run: |
            uv run locust -f tests/performancetests/locustfile.py \
            --headless \
            --users 5 \
            --spawn-rate 1 \
            --run-time 30s \
            --host https://pokemon-classifier-952726112544.europe-west1.run.app \
            --exit-code-on-error
