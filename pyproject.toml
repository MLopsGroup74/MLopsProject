[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "assignment"
version = "0.0.1"
description = "Assignment repository MLops"
authors = [
  { name = "MLopsGroup74", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "evidently==0.4.32",
    "fastapi==0.115.6",
    "gdown>=5.2.1",
    "loguru>=0.7.3",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "python-multipart>=0.0.21",
    "pytorch-lightning>=2.6.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "wandb>=0.24.0",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "mkdocs-material==9.4.6",
    "mkdocs==1.6.1",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mkdocstrings-python==1.12.2",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.coverage.run]
omit = ["tests/*"]


[tool.pytest.ini_options]
markers = [
  "fast: quick running tests"
]

[tool.ruff]
line-length = 120
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "google-cloud-sdk",
  ".venv",
  ".git",
  "__pycache__",
  "wandb",
  "lightning_logs",
  "models",
  "dist",
  "build",
]